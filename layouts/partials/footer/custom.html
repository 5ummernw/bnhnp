{{ with .Site.Params.footer.startDate }}
<script>
(() => {
    const runtime = document.getElementById('site-runtime');
    const startDate = new Date({{ . }}).getTime();
    if (!runtime || !Number.isFinite(startDate)) return;

    function updateRuntime() {
        const days = Math.max(0, Math.floor((Date.now() - startDate) / 86400000));
        runtime.textContent = `Up and running for ${days} ${days === 1 ? 'day' : 'days'}.`;
    }

    updateRuntime();
    setInterval(updateRuntime, 60000);
})();
</script>
{{ end }}
