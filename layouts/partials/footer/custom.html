{{ with .Site.Params.footer.startDate }}
<script>
(() => {
    const runtime = document.getElementById('site-runtime');
    const startDate = new Date({{ . }}).getTime();
    if (!runtime || !Number.isFinite(startDate)) return;

    function updateRuntime() {
        const totalSeconds = Math.max(0, Math.floor((Date.now() - startDate) / 1000));
        const days = Math.floor(totalSeconds / 86400);
        const hours = Math.floor(totalSeconds % 86400 / 3600);
        const minutes = Math.floor(totalSeconds % 3600 / 60);
        const seconds = totalSeconds % 60;
        runtime.textContent = `本站已运行 ${days} 天 ${hours} 小时 ${minutes} 分 ${seconds} 秒`;
    }

    updateRuntime();
    setInterval(updateRuntime, 1000);
})();
</script>
{{ end }}
